name: turboplm

# Bounded container logs. Two reasons, and the second is the one people forget:
# an unbounded json-file log fills the host disk and takes every site on it down,
# and request logs are personal data whose retention has to be describable in a
# privacy notice. 10 MB x 5 gives a stated, finite window.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    restart: unless-stopped
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turboplm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-turboplm}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - turboplm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turboplm -d turboplm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    logging: *default-logging
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-turboplm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-turboplm}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3010}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-25mb}
      WEBHOOK_BLOCK_PRIVATE_HOSTS: ${WEBHOOK_BLOCK_PRIVATE_HOSTS:-false}
      CAD_SERVICE_URL: ${CAD_SERVICE_URL:-http://cad:4100}
      # Public deployments: no self-registration, no demo data/logins.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Role for self-signups: VIEWER keeps a public instance read-only.
      REGISTRATION_ROLE: ${REGISTRATION_ROLE:-VIEWER}
    ports:
      - "127.0.0.1:8010:4000"
    volumes:
      - turboplm-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  cad:
    restart: unless-stopped
    logging: *default-logging
    build: ./cad
    environment:
      UPLOAD_DIR: /app/uploads
      PORT: "4100"
    volumes:
      - turboplm-uploads:/app/uploads

  # Public marketing site for turboplm.com (the hosted app is saas.turboplm.com).
  landing:
    build: ./landing
    container_name: turboplm-landing
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default
      - edge

  web:
    build:
      context: ./frontend
      args:
        # The one-click demo login is OFF here, and this file is the reason it has to be.
        #
        # VITE_* values are compiled into the client bundle — they are public by
        # definition. Setting them here baked `demo@turboplm.com / explore-turboplm` into
        # the JavaScript of every self-hosted build, while the comment above them claimed
        # they were "unset in every other deployment". They were not: this compose file IS
        # every other deployment now. It was written when turboplm.com's public demo ran
        # from it; that demo was retired in October 2026 and only self-hosters run it.
        #
        # The button was also broken: `seed.ts` creates demo@turboplm.local, not
        # demo@turboplm.com, so clicking it failed against a freshly seeded stack.
        #
        # Left unset, Login.tsx does not render the button at all. If you are running a
        # public, throwaway, read-only instance and want it, pass them at build time:
        #   docker compose build --build-arg VITE_DEMO_EMAIL=… --build-arg VITE_DEMO_PASSWORD=…
        # and point them at a VIEWER account you are happy for strangers to share.
    container_name: turboplm-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3010:80"   # local access only; the internet arrives via the edge proxy
    depends_on:
      - api
    networks:
      - default
      - edge

networks:
  # Shared with the Caddy reverse proxy that terminates TLS for every site on
  # this host. Created once with: docker network create edge
  edge:
    external: true

volumes:
  turboplm-pgdata:
  turboplm-uploads:
