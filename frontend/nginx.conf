server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the API container through Docker's embedded DNS on every request.
  # With a literal `proxy_pass http://api:4000`, nginx resolves the name once at
  # startup and caches the address forever, so rebuilding the api container (which
  # gives it a new IP) breaks every /api call with "connection refused" until nginx
  # is restarted. Using a variable forces re-resolution.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads and CAD files can be large and slow.
    client_max_body_size 60m;
    proxy_read_timeout 300s;
  }

  # Hashed bundles are immutable; index.html must always revalidate so a
  # redeploy reaches users immediately.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
