server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Media assets: long-lived, and must not fall back to a page when absent.
  location ~* \.(mp4|webm|jpg|png|svg)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # The marketing page, named explicitly because the catch-all below no longer falls
  # back to it.
  #
  # It used to: `try_files $uri /index.html` answered EVERY unknown path with the
  # marketing page and a 200. That is not merely untidy — it made the site
  # indistinguishable from one where /privacy and /terms existed, so the reviewer who
  # checks those before approving a purchase found a page, read a product pitch, and
  # drew the obvious conclusion. Unknown paths now 404, which is also what lets a
  # missing page be noticed at all.
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Extensionless URLs: /terms serves terms.html. The URL that goes into an email, a
  # supplier questionnaire or a Stripe merchant profile has no file extension in it to
  # break later if these pages ever move behind something else.
  location / {
    try_files $uri $uri.html =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
