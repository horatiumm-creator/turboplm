server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page marketing site: everything resolves to the one document.
  # Media assets: long-lived, and must not fall back to index.html when absent.
  location ~* \.(mp4|webm|jpg|png|svg)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
